<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped">
    <tr>
      <th>Name</th>
      <td><b th:text="${owner.firstName + ' ' + owner.lastName}"></b></td>
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="${owner.address}"></td>
    </tr>
    <tr>
      <th>City</th>
      <td th:text="${owner.city}"></td>
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="${owner.telephone}"></td>
    </tr>
  </table>

  <a th:href="@{{id}/edit(id=${owner.id})}" class="btn btn-primary">Edit
    Owner</a>
  <a th:href="@{{id}/pets/new(id=${owner.id})}" class="btn btn-primary">Add
    New Pet</a>

  <br />
  <br />
  <br />
  <h2>Pets and Visits</h2>

  <table class="table table-striped">
    <tr th:each="pet : ${owner.pets}">
      <td valign="top">
        <dl class="dl-horizontal">
          <dt>Name</dt>
          <dd th:text="${pet.name}"></dd>
          <dt>Birth Date</dt>
          <dd>
            <span th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></span>
            <span th:text="'(' + ${pet.age} + ')'" class="text-muted" style="font-size: 0.9em;"></span>
          </dd>
          <dt>Type</dt>
          <dd th:text="${pet.type.name}"></dd>
        </dl>
      </td>
      <td valign="top">
        <table class="table-condensed">
          <thead>
            <tr>
              <th>Visit Date</th>
              <th>Description</th>
            </tr>
          </thead>
          <tr th:each="visit : ${pet.visits}">
            <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
            <td th:text="${visit.description}"></td>
          </tr>
          <tr>
            <td><a
              th:href="@{{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id},petId=${pet.id})}">Add
                Visit</a></td>
          </tr>
        </table>
      </td>
      <td valign="top">
        <table class="table-condensed">
          <tr>
            <td><a
              th:href="@{{ownerId}/pets/{petId}/edit(ownerId=${owner.id},petId=${pet.id})}">Edit
                Pet</a></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
